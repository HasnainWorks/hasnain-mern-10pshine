name: Build
on:
  push:
    branches:
      - main
      - develop
      - feature/sonarqube-integration
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}